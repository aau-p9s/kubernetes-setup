# ServiceAccount for autoscaler
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoscaler
  namespace: default
---
# ClusterRole allowing access to Deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autoscaler-role
rules:
  - apiGroups: ["apps"]
    resources: ["services", "deployments"]
    verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding for the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autoscaler-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: autoscaler-role
subjects:
  - kind: ServiceAccount
    name: autoscaler
    namespace: default
---
# Deployment for the autoscaler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaler
  template:
    metadata:
      labels:
        app: autoscaler
    spec:
      serviceAccountName: autoscaler
      containers:
        - name: autoscaler
          image: ghcr.io/aau-p9s/autoscaler:latest
          env:
            - name: AUTOSCALER__APIS__FORECASTER
              value: http://forecaster:8081
            - name: AUTOSCALER__APIS__KUBERNETES
              value: https://kubernetes
            - name: AUTOSCALER__APIS__PROMETHEUS
              value: https://prometheus-server
            - name: AUTOSCALER__DEVELOPMENTMODE
              value: "false"
            - name: AUTOSCALER__USEFORECASTERINDEVELOPMENTMODE
              value: "false"
            - name: AUTOSCALER__PGSQL__DATABASE
              value: autoscaler
            - name: AUTOSCALER__PGSQL__USER
              value: root
            - name: AUTOSCALER__PGSQL__PASSWORD
              value: password
            - name: AUTOSCALER__PGSQL__ADDR
              value: postgres
            - name: AUTOSCALER__PGSQL__PORT
              value: "5432"
            - name: AUTOSCALER__ADDR
              value: 0.0.0.0
            - name: AUTOSCALER__PORT
              value: "8080"
          ports:
            - containerPort: 8080
---
# NodePort Service to expose autoscaler on 10.92.1.139:30080
apiVersion: v1
kind: Service
metadata:
  name: autoscaler
spec:
  type: NodePort
  selector:
    app: autoscaler
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

