apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forecaster
  template:
    metadata:
      labels:
        app: forecaster
    spec:
      containers:
        - name: forecaster
          image: ghcr.io/aau-p9s/forecaster:latest
          env:
            - name: FORECASTER__PGSQL__DATABASE
              value: autoscaler
            - name: FORECASTER__PGSQL__USER
              value: root
            - name: FORECASTER__PGSQL__PASSWORD
              value: password
            - name: FORECASTER__PGSQL__ADDR
              value: postgres
            - name: FORECASTER__PGSQL__PORT
              value: "5432"
            - name: FORECASTER__ADDR
              value: 0.0.0.0
            - name: FORECASTER__PORT
              value: "8081"
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: forecaster
spec:
  type: NodePort
  selector:
    app: forecaster
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30081
