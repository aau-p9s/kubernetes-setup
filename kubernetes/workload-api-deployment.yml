apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-api
  template:
    metadata:
      labels:
        app: workload-api
    spec:
      containers:
        - name: workload-api
          image: ghcr.io/aau-p9s/workload-api:latest
          env:
            - name: WORKLOAD_ADDR
              value: 0.0.0.0
            - name: WORKLOAD_PORT
              value: "8082"
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: workload-api
spec:
  type: NodePort
  selector:
    app: workload-api
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
      nodePort: 30082

